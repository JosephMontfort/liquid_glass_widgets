name: Build Demo APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Demo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          java -version

      - name: Prepare Root Library Package
        run: |
          flutter pub get

      - name: Generate and Configure Android Scaffold
        working-directory: example
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Android platform scaffolding for example app..."
            flutter create --platforms=android --org com.liquidglass.widgets .
          fi

          # Ensure minSdk is 21+ required by video_player, webview_flutter, and Impeller
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
          fi

          flutter pub get

      - name: Analyze Example App
        working-directory: example
        run: |
          flutter analyze --fatal-warnings --no-fatal-infos

      - name: Build Android Release APK
        working-directory: example
        run: |
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassWidgets-Demo-Release-APK
          path: example/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
